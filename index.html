<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Simple Website</title>
    <style>
        /* =========================================
           CHANGE YOUR WEBSITE COLORS HERE
           ========================================= */
        body {
            background-color: #ffffff; /* Background Color */
            color: #ffffff;            /* Text Color */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background-color: #1e293b; /* Card Box Color */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            color: #38bdf8; /* Heading Text Color */
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello from AWS CodePipeline!</h1>
        <p>My simple website is live.</p>
    </div>
</body>
</html>
